# ============================================================
# GitHub Actions CI/CD Pipeline
# Automatically deploys to Databricks when code is pushed to main
# Equivalent of AWS CodePipeline for Databricks
# ============================================================

name: Deploy to Databricks

on:
  push:
    branches:
      - main              # Triggers on push to main (PROD deploy)
      - 'feature/**'      # Runs tests on feature branch pushes (no deploy)
  pull_request:
    branches:
      - main              # Runs tests on PR (no deploy)

jobs:
  # ============================================================
  # JOB 1: Run Tests
  # ============================================================
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install pytest

      - name: Run unit tests
        run: |
          pytest tests/test_autoloader.py -v
          echo "✅ All tests passed!"

  # ============================================================
  # JOB 2: Deploy to Databricks (only on push to main)
  # ============================================================
  deploy:
    name: Deploy to Databricks
    runs-on: ubuntu-latest
    needs: test                     # Only runs if tests pass
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks Bundle
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle validate
          echo "✅ Bundle is valid!"

      - name: Deploy to Databricks PROD
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks bundle deploy --target prod
          echo "✅ Deployed to Databricks PROD!"

      - name: Verify Job Created
        env:
          DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
        run: |
          databricks jobs list | grep "AutoLoader_Bronze_Sales_Pipeline"
          echo "✅ Job verified in Databricks!"
